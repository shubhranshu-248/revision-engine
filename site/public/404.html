<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Revio</title>
    <script>
      // GitHub Pages SPA redirect: rewrite the deep URL into a hash and
      // send the user to the index. index.html then reads the hash and
      // pushes the real path back onto the history.
      var pathSegmentsToKeep = 1; // 1 for user-page repo path (e.g. /revio/)
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
